<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>CrewSplit</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 14px; text-align: center; padding: 24px; }
    .logo { font-size: 44px; }
    .muted { color: #9aa0a6; font-size: 14px; max-width: 280px; line-height: 1.5; }
    button { margin-top: 8px; padding: 10px 18px; border: 1px solid #333; border-radius: 10px;
      background: #111; color: #fff; font-size: 15px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="logo">⚓</div>
    <div>CrewSplit</div>
    <div class="muted">Není připojení k internetu. Zkontroluj síť a zkus to znovu.</div>
    <button onclick="location.reload()">Zkusit znovu</button>
  </div>
</body>
</html>
